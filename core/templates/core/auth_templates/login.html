{% extends 'base.html' %}

{% block title %}Login{% endblock %}

{% block content %}
    <div class="ui container">
        <div class="ui center aligned segment">
            <h1 class="ui header">Login</h1>
        </div>
        <div class="ui divider"></div>
        <form method="post" action="" class="ui form">
            {% csrf_token %}

            <div class="field">
                <label class="text-light">Username</label>
                <input type="text" name="username" placeholder="Enter username">
            </div>

            <div class="field text-light">
                <label class="text-light">Password</label>
                <input type="password" name="password" placeholder="Enter password">
            </div>

            <button class="ui orange button" type="submit">Login</button>
        </form>
        <hr class="text-orange">
        <div class="ui center aligned segment">
            <p class="ui text-light text">Don't have an account yet? <a href="{% url 'core:register' %}">Register</a> now!</p>
            <p class="ui text-light text">Forgot your password? <a href="{% url 'core:forgot_password' %}">Reset</a> it!</p>
        </div>
    </div>
{% endblock %}
