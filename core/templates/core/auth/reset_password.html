{% extends 'base.html' %}

{% block title %}Reset Password{% endblock %}

{% block content %}
    <div class="ui container">
        <div class="ui center aligned segment">
            <h1 class="ui header">Reset Password</h1>
        </div>
        <div class="ui divider"></div>
        <form method="post" action="" class="ui form">
            {% csrf_token %}

            <div class="field">
                <label class="text-light">New Password</label>
                <input type="text" name="new_password" placeholder="Enter new password">
            </div>

            <div class="field text-light">
                <label class="text-light">Confirm New Password</label>
                <input type="text" name="confirm_password" placeholder="Confirm password">
            </div>

            <button class="ui orange button" type="submit">Update</button>
        </form>
    </div>
{% endblock %}
