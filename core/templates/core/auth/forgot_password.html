{% extends 'base.html' %}

{% block title %}Forgot Password{% endblock %}

{% block content %}
    <div class="ui container">
        <div class="ui center aligned segment">
            <h1 class="ui header">Forgot Password</h1>
        </div>
        <div class="ui divider"></div>
        <form method="post" action="" class="ui form">
            {% csrf_token %}

            <div class="field">
                <label class="text-light">Email</label>
                <input type="text" name="email" placeholder="Enter email">
            </div>

            <button class="ui orange button" type="submit">Send</button>
        </form>
        <hr class="text-orange">
        <div class="ui center aligned segment">
            <p class="ui text-light text">Want to resend a letter? <a href="{% url 'core:resend_forgot_password' %}">Resend</a> now!</p>
            <p class="ui text-light text">Remember your password? <a href="{% url 'core:login' %}">Login</a> now!</p>
        </div>
    </div>
{% endblock %}
