<!DOCTYPE html>
{% load static %}
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>{% block title %}Simple Social Network{% endblock %}</title>
    <link href="{% static 'css/bootstrap/css/bootstrap.min.css' %}" rel="stylesheet">
    <link href="{% static 'css/bootstrap/bootstrap_icons/bootstrap-icons.css' %}" rel="stylesheet">
    <link href="{% static 'css/styles.css' %}" rel="stylesheet">
    {% block css %}{% endblock %}
</head>
<body class="bg-dark">
    <nav class="navbar navbar-expand-lg bg-orange">
        <div class="container-fluid">
            <a class="navbar-brand text-light" href="#">Simple Social Network</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarText" aria-controls="navbarText" aria-expanded="false" aria-label="Toggle navigation">
                <span class="navbar-toggler-icon"></span>
            </button>
        </div>
    </nav>
    {% block content %}
    {% endblock %}
</body>
</html>
