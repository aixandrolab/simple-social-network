<!DOCTYPE html>
{% load static %}
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>{% block title %}Simple Social Network{% endblock %}</title>
    <link href="{% static 'css/bootstrap/css/bootstrap.min.css' %}" rel="stylesheet">
    <link href="{% static 'css/bootstrap/bootstrap_icons/bootstrap-icons.css' %}" rel="stylesheet">
    <link href="{% static 'css/styles.css' %}" rel="stylesheet">
    {% block css %}{% endblock %}
</head>
<body class="bg-dark text-light">
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark" style="box-shadow: 0 0 5px 0 darkorange">
        <div class="container-fluid">
            <a class="navbar-brand text-light" href="{% url 'core:home' %}">{{ site_config.name }}</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarText" aria-controls="navbarText" aria-expanded="false" aria-label="Toggle navigation">
                <span class="navbar-toggler-icon"></span>
            </button>
            {% if not request.user.is_authenticated %}
                <a href="{% url 'core:login' %}" class="text-decoration-none text-light">Login/Register</a>
            {% else %}
                <ul class="navbar-nav">
                    <li class="nav-item dropdown">
                        <a class="nav-link dropdown-toggle" href="#" id="navbarDarkDropdownMenuLink" role="button" data-bs-toggle="dropdown" aria-expanded="false">
                            {{ request.user.username }}
                        </a>
                        <ul class="dropdown-menu dropdown-menu-end dropdown-menu-dark" aria-labelledby="navbarDropdownMenuLink">
                            <li>
                                <a class="dropdown-item" href="{% url 'profiles:profile_detail' %}">
                                    <i class="bi bi-house-door-fill"></i> Profile
                                </a>
                            </li>
                            <li>
                                <hr class="dropdown-divider">
                            </li>
                            <li>
                                <a class="dropdown-item" href="{% url 'profiles:logout' %}">
                                    <i class="bi bi-door-closed-fill"></i> Logout
                                </a>
                            </li>
                        </ul>
                    </li>
                </ul>
            {% endif %}
        </div>
    </nav>
    <div style="margin-top: 10px">
        {% block content %}
        {% endblock %}
    </div>
    <script src="{% static 'js/bootstrap/js/bootstrap.bundle.min.js' %}"></script>
</body>
</html>
