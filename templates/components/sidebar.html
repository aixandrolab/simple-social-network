<div class="ui vertical inverted sidebar menu left">
    <div class="item">
        <div class="header">{{ site_config.name }}</div>
        <div class="menu">
            <a class="item" href="{% url 'core:home' %}">
                <i class="home icon"></i> Home
            </a>
            <div class="divider">
                <hr>
            </div>
            {% if request.user.is_authenticated %}
                <a class="item" href="{% url 'profiles:profile_detail' %}">
                    <i class="user icon"></i> Profile
                </a>
            <div class="divider">
                <hr>
            </div>
                <a class="item" href="{% url 'profiles:settings' %}">
                    <i class="wrench icon"></i> Settings
                </a>
                <a class="item" href="{% url 'profiles:two_factor_manage' %}">
                    <i class="shield icon"></i> Two-Factor Manage
                </a>
                <a class="item" href="{% url 'profiles:change_password' %}">
                    <i class="lock icon"></i> Change Password
                </a>
            <div class="divider">
                <hr>
            </div>
                <a class="item" href="{% url 'profiles:logout' %}">
                    <i class="sign-out icon"></i> Logout
                </a>
            {% else %}
                <a class="item" href="{% url 'core:login' %}">
                    <i class="sign-in icon"></i> Login
                </a>
                <a class="item" href="{% url 'core:register' %}">
                    <i class="sign-in icon"></i> Register
                </a>
            {% endif %}
        </div>
    </div>
</div>
