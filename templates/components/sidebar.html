<div class="ui vertical inverted sidebar menu left">
    <div class="item">
        <div class="header">{{ site_config.name }}</div>
        <div class="menu">
            <a class="item" href="{% url 'core:home' %}">
                <i class="home icon"></i> Home
            </a>
            <div class="divider">
                <hr>
            </div>
            {% if request.user.is_authenticated %}
                <a class="item" href="{{ request.user.profile.get_absolute_url }}">
                    <i class="user icon"></i> Profile
                </a>
                <a class="item" href="{% url 'profiles:profile_search' %}">
                    <i class="search icon"></i> Profile search
                </a>
                <div class="divider">
                    <hr>
                </div>
                <a class="item" href="{% url 'profiles:active_chats' %}">
                    <i class="envelope icon"></i> Active chats
                </a>
                <div class="divider">
                    <hr>
                </div>
                <a class="item" href="{% url 'profiles:friends_list' request.user.username %}">
                    <i class="users icon"></i> Friends list
                </a>
                <a class="item" href="{% url 'profiles:incoming_friendship_requests' %}">
                    <i class="user plus icon"></i> Incoming friend requests
                </a>
                <a class="item" href="{% url 'profiles:outgoing_friendship_reqeusts' %}">
                    <i class="paper plane outline icon"></i> Outgoing friend requests
                </a>
                <div class="divider">
                    <hr>
                </div>
                <a class="item" href="{% url 'profiles:settings' %}">
                    <i class="wrench icon"></i> Settings
                </a>
                <a class="item" href="{% url 'profiles:two_factor_manage' %}">
                    <i class="shield icon"></i> Two-Factor Manage
                </a>
                <a class="item" href="{% url 'profiles:change_password' %}">
                    <i class="lock icon"></i> Change Password
                </a>
            <div class="divider">
                <hr>
            </div>
                <a class="item" href="{% url 'profiles:logout' %}">
                    <i class="sign-out icon"></i> Logout
                </a>
            {% else %}
                <a class="item" href="{% url 'core:login' %}">
                    <i class="sign-in icon"></i> Login
                </a>
                <a class="item" href="{% url 'core:register' %}">
                    <i class="sign-in icon"></i> Register
                </a>
            {% endif %}
        </div>
    </div>
</div>
