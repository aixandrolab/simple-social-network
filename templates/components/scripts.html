{% load static %}
<script src="{% static 'js/jquery-3.6.0.min.js' %}"></script>
<script src="{% static 'js/semantic.min.js' %}"></script>
<script>
    $(document).ready(function() {
        $('.ui.sidebar').sidebar();

        $('.sidebar-toggle').click(function() {
            $('.ui.sidebar').sidebar('toggle');
        });
    });

    $('.message .close')
      .on('click', function() {
        $(this)
          .closest('.message')
          .transition('fade')
        ;
      })
    ;
</script>
