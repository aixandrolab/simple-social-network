<script>
    const messagesContent = window.messagesContent || {};
    document.addEventListener('DOMContentLoaded', function() {
        let chatSocket;
        const chatId = '{{ chat.id }}'
        const userId = '{{ request.user.id }}'
        const messageContainer = document.querySelector('.chat-messages')
        const messageForm = document.querySelector('#message-form');
        const messageInput = document.querySelector('#messageContent');

        function connectWebSocket() {
            chatSocket = new WebSocket(
                'ws://' + window.location.host + '/ws/chat/' + chatId + '/'
            );

            chatSocket.onmessage = function(e) {
                const data = JSON.parse(e.data)
                switch (data.type) {
                    case 'chat_message_event':
                        handleNewMessage(data);
                        break;
                    case 'edit_message_event':
                        handleEditMessage(data);
                        break;
                    case 'delete_message_event':
                        handleDeleteMessage(data)
                        break;
                    case 'error':
                        console.error('WebSocket Error: ', data.error);
                        break;
                }
            };

            chatSocket.onclose = function(e) {
                console.log('WebSocket closed, reconnecting...');
                setTimeout(connectWebSocket, 5000);
            };

            chatSocket.onerror = function(e) {
                console.error('WebSocket error:', e);
            };
        }

        function handleNewMessage(data) {
            const isCurrentUser = data.sender_id == userId;
            messagesContent[data.message_id] = data.content

            const messageHtml = `
                <div class="message-wrapper ${isCurrentUser ? `message-wrapper-right` : `message-wrapper-left`}" id="message-${data.message_id}">
                    <div class="message-bubble ${isCurrentUser ? `message-right` : `message-left`}">
                        <div ${isCurrentUser ? style="display: flex; align-items: flex-start; max-width: 100%;" : style='' }>
                            ${!isCurrentUser ? `<img class="message-avatar" src="${data.sender_avatar_url}" alt="${data.sender_name}">` : ''}
                            <div class="message-bubble-content" style="position: relative;">
                                ${isCurrentUser ?
                                    `<div class="message-actions">
                                        <button class="ui mini compact icon button edit-message-btn"
                                                style="background: rgba(0,0,0,0.3); padding: 5px; margin: 0;"
                                                data-message-id="${data.message_id}"
                                                data-message-content="${data.content}">
                                            <i class="edit outline icon" style="margin: 0; color: white;"></i>
                                        </button>
                                        <button data-message-id="${data.message_id}"
                                           class="ui mini compact icon button delete-btn"
                                           style="background: rgba(0,0,0,0.3); padding: 5px; margin: 0;">
                                            <i class="trash alternate outline icon" style="margin: 0; color: white;"></i>
                                        </button>
                                    </div>` :
                                    `<div class="message-sender-name">
                                        ${data.sender_name}
                                    </div>`}

                                <div class="message-text">
                                    ${data.content}
                                </div>
                                <div class="message-meta">
                                    <span><i class="clock outline icon"></i> ${formatTimeAgo(data.timestamp)}</span>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            `;

            messageContainer.insertAdjacentHTML('beforeend', messageHtml);
            messageContainer.scrollTop = messageContainer.scrollHeight;
        }

        function sendMessage() {
            const content = messageInput.value.trim();
            if (content && chatSocket.readyState === WebSocket.OPEN) {
                chatSocket.send(JSON.stringify({
                    type: 'chat_message_event',
                    content: content
                }));
                messageInput.value = '';
            }
        }

        messageForm.addEventListener('submit', function(e) {
            e.preventDefault();
            sendMessage();
        });

        messageInput.addEventListener('keydown', function(e) {
            if (e.key === 'Enter' && !e.shiftKey) {
                e.preventDefault();
                sendMessage();
            }
        });

        function handleDeleteMessage(data) {
            const message = document.querySelector(`#message-${data.message_id}`);
            if (message) {
                message.remove()
            }
        }

        $(document).on('click', '.delete-btn', function() {
            const messageId = $(this).data('message-id');
            console.log(messageId)
            if (confirm('Are you sure you want to delete this message?')) {
                if (chatSocket.readyState === WebSocket.OPEN) {
                    chatSocket.send(JSON.stringify({
                        type: 'delete_message_event',
                        message_id: messageId
                    }));
                }
            }
        })

        function formatTimeAgo(timestamp) {
            const now = new Date();
            const messageTime = new Date(timestamp);
            const seconds = Math.floor((now - messageTime) / 1000);
            const minutes = Math.floor(seconds / 60);
            const hours = Math.floor(minutes / 60);
            const days = Math.floor(hours / 24);

            if (seconds < 60) return "just now";
            if (minutes < 60) return `${minutes} minute${minutes === 1 ? '' : 's'} ago`;
            if (hours < 24) return `${hours} hour${hours === 1 ? '' : 's'} ago`;
            return `${days} day${days === 1 ? '' : 's'} ago`;
        }

        function handleEditMessage(data) {
            const message = document.querySelector(`#message-${data.message_id}`);

            if (message) {
                let textContainer = message.querySelector('.message-text');
                if (textContainer) {
                    textContainer.textContent = data.content;
                    message[data.message_id] = data.content;
                } else {
                    console.log('Text container not found.');
                }

                const timestampElement = message.querySelector('span')
                if (timestampElement) {
                    timestampElement.innerHTML = `
                        ${formatTimeAgo(data.timestamp)}
                        <span><i class="pencil icon"></i>Edited ${formatTimeAgo(data.edited_at)}</span>
                    `;
                }
            } else {
                console.error('Message is not defined.')
            }
        }

        const messagesScroll = document.getElementById('messages-scroll');
        if (messagesScroll) {
            messagesScroll.scrollTop = messagesScroll.scrollHeight;
        }

        $(document).on('click', '.edit-message-btn', function() {
            const messageId = $(this).data('message-id');
            const messageContent = $(this).data('message-content');


            if (messageContent) {
                $('#edit-message-id').val(messageId);
                $('#edit-message-content').val(messageContent);
                $('#editMessageModal').modal('show');
            } else {
                console.error('Message content not found.');
                const messageElement = document.querySelector(`#message-${messageId}`);
                if (messageElement) {
                    const text = messageElement.querySelector('.message-text')?.textContent;
                    if (text) {
                        $('#edit-message-id').val(messageId);
                        $('#edit-message-content').val(messageContent);
                        $('#editMessageModal').modal('show');
                        messageContent[messageId] = text;
                    }
                }
            }
        });

        $('#edit-message-form').on('submit', function (e) {
            e.preventDefault()
            const messageId = $('#edit-message-id').val()
            const content = $('#edit-message-content').val()
            if (content && messageId && chatSocket.readyState === WebSocket.OPEN) {
                chatSocket.send(JSON.stringify({
                    type: 'edit_message_event',
                    message_id: messageId,
                    content: content
                }));
                $('#editMessageModal').modal('hide');
            }
        })

        connectWebSocket();
    });
    $('.ui.dropdown')
      .dropdown({
          action: 'nothing'
      })
    ;
</script>
